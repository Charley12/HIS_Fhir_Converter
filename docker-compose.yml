version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fhir-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-fhir_mapping}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fhir-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: fhir-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - fhir-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fhir-backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-fhir_mapping}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - GOOGLE_VERTEX_AI_KEY=${GOOGLE_VERTEX_AI_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - qdrant
    networks:
      - fhir-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fhir-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fhir-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  fhir-network:
    driver: bridge
